name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build exe
        run: pyinstaller main.spec

      - name: Verify fresh frozen executable
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $verificationDir = Join-Path $env:RUNNER_TEMP 'applauncher-frozen-verification'
          $process = Start-Process -FilePath (Resolve-Path 'dist/applauncher.exe').Path -ArgumentList @('--verify-design', ('"' + $verificationDir + '"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen verification failed: $($process.ExitCode)" }
          $result = Get-Content -Raw (Join-Path $verificationDir 'verification.json') | ConvertFrom-Json
          if ($result.passed -ne $true -or $result.frozen -ne $true) { throw 'Fresh executable did not pass frozen design verification' }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\applauncher.iss'
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/applauncher.exe
            installer/Output/*.exe
          generate_release_notes: true
